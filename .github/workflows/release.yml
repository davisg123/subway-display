name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease:
        description: "Publish as a pre-release (release candidate)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history

      - name: Compute next version
        id: ver
        run: |
          # Base the bump on the latest *stable* tag only (ignore vX.Y.Z-rc.N),
          # so a string of release candidates doesn't shift the target version.
          latest=$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          latest=${latest:-v0.0.0}
          ver=${latest#v}
          IFS=. read -r major minor patch <<< "$ver"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          base="v$major.$minor.$patch"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            # Next rc number for this target version (rc.1, rc.2, ...).
            n=$(( $(git tag -l "${base}-rc.*" | wc -l) + 1 ))
            next="${base}-rc.${n}"
          else
            next="$base"
          fi
          echo "Releasing $next (latest stable $latest)"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        env:
          FIRMWARE_VERSION: ${{ steps.ver.outputs.next }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: pio run -e adafruit_matrixportal_esp32s3

      - name: Create and push tag
        run: |
          git tag ${{ steps.ver.outputs.next }}
          git push origin ${{ steps.ver.outputs.next }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.next }}
          prerelease: ${{ inputs.prerelease }}
          files: .pio/build/adafruit_matrixportal_esp32s3/firmware.bin
          generate_release_notes: true
