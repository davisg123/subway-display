<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subway Sign — Live</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #111; color: #aaa;
    font: 14px/1.4 -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  /* The canvas is the LED panel. Emscripten/SDL renders into #canvas.
     image-rendering:pixelated keeps the LED dots crisp when scaled. */
  #canvas {
    background: #000;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
    image-rendering: pixelated;
    max-width: 95vw;
    height: auto;
  }
  #status { margin-top: 12px; font-size: 12px; color: #666; }
</style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">starting…</div>

<script>
  // --- Config -------------------------------------------------------------
  // Where to fetch arrivals from. The live API has no CORS headers, so a page
  // on another origin can't read it directly. Options:
  //   - Local dev: serve.py proxies "/trains/nearby" with CORS added.
  //   - Production: enable CORS on the API Gateway and point this at it,
  //     or serve the page behind a same-origin proxy.
  const API_URL = "/trains/nearby?lat=40.706400&lon=-74.011400&limit=4";
  const POLL_INTERVAL_MS = 60_000;

  const statusEl = document.getElementById("status");
  let feedTrains = null;  // bound after the WASM runtime is ready

  async function poll() {
    if (!feedTrains) return;
    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      feedTrains(text);              // hand raw JSON to WASM (parsed in C++)
      statusEl.textContent = "updated " + new Date().toLocaleTimeString();
    } catch (e) {
      statusEl.textContent = "fetch failed: " + e.message;
    }
  }

  // Emscripten Module hooks. onRuntimeInitialized fires once main() is alive.
  var Module = {
    canvas: document.getElementById("canvas"),
    print:   (t) => console.log(t),
    printErr:(t) => console.warn(t),
    onRuntimeInitialized() {
      feedTrains = Module.cwrap("feed_trains", null, ["string"]);
      poll();
      setInterval(poll, POLL_INTERVAL_MS);
    },
  };
</script>
<script src="subway_sim.js"></script>
</body>
</html>
